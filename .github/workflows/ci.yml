name: Continuous Integration

on: [pull_request]

jobs:

  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node: [18, 20, 22, 24]

    steps:
    - uses: actions/checkout@v6

    - name: Use build Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24.12.0

    - name: Installing project dependencies
      run: |
        npm ci

    - name: Lint
      run: |
        npm run lint

    - name: Build
      run: npm run build

    - name: Check types
      run: npm run check

    - name: Use test Node.js ${{ matrix.node }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}

    - name: Test compiled output
      run: npm test
